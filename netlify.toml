    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'"

# Prompt 5: verifica pubblica dei rapporti (solo dati minimi)
[[headers]]
  for = "/rapporto/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/certificato/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Prompt 7 — PRONTO SEO: la dashboard /admin/seo/ ricade già in /admin/*; rinuncia alle recensioni mai indicizzata
[[headers]]
  for = "/recensioni/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

